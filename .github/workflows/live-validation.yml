name: FPI - vérification réelle StatsBomb et navigateur

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/validate_reference_live.py'
      - 'scripts/browser_smoke.py'
      - '.github/workflows/live-validation.yml'
      - 'src/fpi/**'
      - 'app.py'

permissions:
  contents: read

jobs:
  real-data-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FPI_DATA_DIR: data/raw
      FPI_SCREENSHOT_DIR: outputs/browser-proof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Préparer les dépendances isolées
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Vérifier le match officiel et les cinq modules avec les événements réels
        run: |
          .venv/bin/python scripts/validate_reference_live.py
      - name: Installer uniquement le navigateur éphémère du runner
        run: |
          .venv/bin/python -m pip install "playwright>=1.50,<2"
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Démarrer Streamlit et tester le parcours navigateur
        run: |
          .venv/bin/python -m streamlit run app.py --server.headless true --server.port 8501 --server.address 127.0.0.1 > /tmp/fpi-streamlit.log 2>&1 &
          echo $! > /tmp/fpi-streamlit.pid
          .venv/bin/python scripts/browser_smoke.py
      - name: Journal Streamlit en cas d'échec
        if: failure()
        run: cat /tmp/fpi-streamlit.log || true
      - name: Conserver les captures du navigateur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpi-browser-proof
          path: outputs/browser-proof/*.png
          if-no-files-found: warn
          retention-days: 7
