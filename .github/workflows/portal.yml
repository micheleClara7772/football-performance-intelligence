name: Portail privé FPI
on:
  push:
    paths: ['portal/**', '.github/workflows/portal.yml']
  pull_request:
    paths: ['portal/**', '.github/workflows/portal.yml']
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node --check public/app.js
      - run: python3 scripts/check_evidence.py
