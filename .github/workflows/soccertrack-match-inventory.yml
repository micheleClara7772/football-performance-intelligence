name: FPI - inventaire du match SoccerTrack 117093
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/soccertrack-match-inventory.yml'
      - 'scripts/inspect_soccertrack_match.py'

permissions:
  contents: read

jobs:
  inventory-one-gated-match:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les bibliothèques en environnement éphémère
        run: |
          python -m pip install 'huggingface_hub>=0.28,<2' 'pytest>=8,<10'
          python -m pip check
      - name: Valider la sélection et la lecture de référence
        run: PYTHONPATH=src python -m pytest -q tests/test_soccertrack_inventory.py
      - name: Inventorier un seul match et lire uniquement sa petite annotation MOT
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          PYTHONPATH=src python -m scripts.inspect_soccertrack_match \
            --match-id 117093 \
            --download-mot \
            --out outputs/soccertrack-117093-inventory.json
      - name: Résumer les tailles et les observations dans les logs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("outputs/soccertrack-117093-inventory.json").read_text())
          print("FPI_MATCH_FILES=" + str(data.get("file_count")))
          print("FPI_MATCH_KNOWN_BYTES=" + str(data.get("known_total_bytes")))
          print("FPI_MATCH_VIDEO_FILES=" + str(data.get("video_file_count")))
          for entry in data.get("files", []):
              if entry["path"].startswith(("videos/", "gsr/", "mot/", "ball/", "bas/")):
                  print("FPI_MATCH_FILE=" + entry["path"] + " bytes=" + str(entry.get("size_bytes")))
          print("FPI_MOT_STATS=" + json.dumps(data.get("mot_reference", {}), sort_keys=True))
          PY
      - name: Archiver uniquement les tailles et statistiques, jamais les médias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpi-soccertrack-one-match-inventory
          path: outputs/soccertrack-117093-inventory.json
          if-no-files-found: warn
          retention-days: 3
