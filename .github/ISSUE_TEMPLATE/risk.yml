name: Risque ou décision
description: Risque, dépendance ou arbitrage produit
labels: ["type:decision"]
body:
  - type: textarea
    id: risk
    attributes:
      label: Risque ou décision à prendre
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options, impacts, proposition
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Date limite de décision
